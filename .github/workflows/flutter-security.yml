name: Flutter Security & Quality Scan

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "apps/mobile/**"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "apps/mobile/**"

permissions:
  contents: read

jobs:
  flutter-security:
    name: Flutter Security & Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.0
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.16.0
        with:
          flutter-version: "3.41.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Scan dependencies for vulnerabilities
        run: flutter pub get

      - name: Run Flutter Static Analysis
        run: flutter analyze
