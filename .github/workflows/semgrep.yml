name: Backend & Infrastructure Security Scan

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "apps/backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "apps/backend/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep Scan
        run: semgrep scan --config auto --error
